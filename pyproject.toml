[project]
name = "academia-novit-2026"
version = "0.1.0"
description = "PIA-3 plant assistant for the Academia Novit 2026 first deliverable"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "paho-mqtt>=2.1",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    "fastembed>=0.4",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "transformers>=4.44",
    "torch>=2.4",
    "mcp>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a running plant or database",
]

[tool.ruff]
line-length = 118
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
