# Control-network gateway to the assistant UI. The core service stays on the
# internal plant network; this panel is the only user-facing ingress.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://cerebro:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
